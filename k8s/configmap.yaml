# ──────────────────────────────────────────────────────────────────
# FinPilot AI – ConfigMap (Non-secret configuration)
# ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: finpilot-config
  namespace: finpilot
  labels:
    app.kubernetes.io/name: finpilot
data:
  APP_NAME: "FinPilot AI"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  CORS_ORIGINS: '["https://finpilot.example.com"]'
  OPENROUTER_MODEL: "openai/gpt-oss-120b:free"
  REDIS_URL: "redis://redis-service:6379/0"
  NEXT_PUBLIC_API_URL: "https://api.finpilot.example.com"
