# ──────────────────────────────────────────────────────────────────
# FinPilot AI – Frontend Service
# ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: finpilot
  labels:
    app.kubernetes.io/name: finpilot
    app.kubernetes.io/component: frontend
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
