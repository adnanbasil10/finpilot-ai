# ──────────────────────────────────────────────────────────────────
# FinPilot AI – PostgreSQL Deployment (Dev/Staging Only)
# ──────────────────────────────────────────────────────────────────
# ⚠️  PRODUCTION: Use AWS RDS or a managed PostgreSQL service.
#    Running PostgreSQL in Kubernetes is NOT recommended for
#    production workloads due to data persistence and backup
#    complexity. This manifest is for development/staging only.
# ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: finpilot
  labels:
    app.kubernetes.io/name: finpilot
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finpilot
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: finpilot-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finpilot-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: finpilot-secrets
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "finpilot"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "finpilot"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: pgdata
          emptyDir: {}
      restartPolicy: Always
