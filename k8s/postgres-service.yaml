# ──────────────────────────────────────────────────────────────────
# FinPilot AI – PostgreSQL Service
# ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: finpilot
  labels:
    app.kubernetes.io/name: finpilot
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
