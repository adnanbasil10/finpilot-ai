# ──────────────────────────────────────────────────────────────────
# FinPilot AI – Redis Service
# ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: finpilot
  labels:
    app.kubernetes.io/name: finpilot
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
